name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cible:
        description: "Index visé"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  verifier:
    name: Cohérence du tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lire.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lire la version du paquet
        id: lire
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('dsup/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version du paquet : $version"

      - name: Le tag doit correspondre à __version__
        # Hatch tire la version de dsup/__init__.py, alors que le tag est posé
        # à la main : les deux peuvent diverger en silence. Sans ce garde-fou,
        # `git tag v0.2.0` sur un __init__.py resté à 0.1.0 tenterait de
        # republier la 0.1.0 — or un numéro consommé sur PyPI ne peut JAMAIS
        # être réutilisé. C'est la vérification la plus rentable du fichier.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          paquet="${{ steps.lire.outputs.version }}"
          if [ "$tag" != "$paquet" ]; then
            echo "::error::tag v$tag ≠ __version__ $paquet — corrigez dsup/__init__.py ou le tag"
            exit 1
          fi
          echo "tag v$tag et __version__ concordent"

  controler:
    name: Vérifications
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer
        run: pip install -e ".[dev]"

      - name: Typage et tests
        # On ne publie jamais ce qui n'a pas passé les mêmes barrières que la
        # CI ordinaire : un tag peut être posé sur un commit jamais vérifié.
        run: |
          mypy
          pytest -q

  construire:
    name: Construction
    needs: controler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Construire et valider
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publier:
    name: Envoi vers ${{ (github.event_name == 'workflow_dispatch' && inputs.cible) || 'pypi' }}
    needs: construire
    runs-on: ubuntu-latest
    # L'environnement cantonne le jeton à ce seul travail et permet d'exiger
    # une approbation manuelle avant tout envoi — un envoi étant irréversible.
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.cible) || 'pypi' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publier
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.cible == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
